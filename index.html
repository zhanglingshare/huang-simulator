<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黄仁勋未来决策模拟器 · 社会计算沙箱</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{
  --bg:#080b12;--bg2:#0c111d;--panel:#121a2c;--panel2:#172136;--line:#22304d;
  --txt:#e8eefc;--sub:#93a2c0;--mut:#64748f;
  --cyan:#3ee0ff;--vio:#8b7bff;--grn:#3ddc97;--amb:#ffb454;--red:#ff5c7a;--blu:#5aa2ff;
  --glow:0 0 24px rgba(62,224,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:radial-gradient(1100px 520px at 82% -12%,#152643 0%,var(--bg) 55%),var(--bg);
  color:var(--txt);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14.5px;line-height:1.55;letter-spacing:.2px}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.4px}
a{color:var(--cyan);text-decoration:none}
.mut{color:var(--mut)}.sub{color:var(--sub)}
.cyan{color:var(--cyan)}.vio{color:var(--vio)}.grn{color:var(--grn)}.amb{color:var(--amb)}.red{color:var(--red)}.blu{color:var(--blu)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px}.col{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}.grow{flex:1}.center{align-items:center}.between{justify-content:space-between}

#sticky{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(8,11,18,.97),rgba(8,11,18,.88));
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
#topbar{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px 6px}
#topbar .t{font-weight:900;font-size:16px;letter-spacing:.5px}
#topbar .t small{display:block;font-size:10.5px;color:var(--mut);font-weight:400;letter-spacing:1.5px;margin-top:1px}
#hero{max-width:1180px;margin:0 auto;padding:2px 12px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ringcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.ringcell canvas{width:100%;max-width:86px;height:auto}
.ringcell .nm{font-size:11px;color:var(--sub);white-space:nowrap}
.ringcell .mini{width:100%;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.ringcell .mini i{display:block;height:100%;border-radius:4px}

#navwrap{max-width:1180px;margin:14px auto 0;padding:0 14px}
#navchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#navchips::-webkit-scrollbar{display:none}
.pn{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:12.5px;color:var(--sub);
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap}
.pn.on{color:var(--cyan);border-color:var(--cyan);box-shadow:var(--glow)}

#content{max-width:1180px;margin:0 auto;padding:6px 14px 96px}
@media(min-width:900px){#content{padding-bottom:104px}}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);border:1px solid var(--line);
  border-radius:16px;padding:16px;position:relative;overflow:hidden;margin-bottom:14px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(62,224,255,.5),transparent)}
.card h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .tag{font-size:10.5px;color:var(--mut);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kpi .v{font-size:21px;font-weight:800;font-family:ui-monospace,monospace}
.kpi .l{font-size:11px;color:var(--mut);margin-top:2px}
.cv-wrap{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.cv-wrap .cap{font-size:11px;color:var(--mut);margin-bottom:6px}
canvas{display:block;width:100%;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);background:var(--panel2);color:var(--sub);white-space:nowrap;margin:2px}
.chip.on{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow)}
.tag{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:500}
.t-conf{background:rgba(61,220,151,.15);color:var(--grn)}
.t-rep{background:rgba(255,180,84,.15);color:var(--amb)}
.t-rum{background:rgba(255,92,122,.15);color:var(--red)}
.t-miss{background:rgba(100,116,143,.18);color:var(--mut)}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:11px 16px;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;width:100%;transition:.15s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,#0e7d96,#1560c8);border-color:transparent;box-shadow:var(--glow)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:12.5px;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opt{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel2);cursor:pointer;transition:.15s}
.opt.sel{border-color:var(--cyan);box-shadow:var(--glow)}
.opt h4{display:flex;align-items:center;gap:8px;font-size:13.5px}
.barline{display:flex;align-items:center;gap:10px;margin:8px 0}
.barline .lab{width:96px;font-size:12.5px;color:var(--sub);flex:0 0 auto}
.barline .track{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.barline .fill{height:100%;border-radius:6px}
.barline .num{width:60px;text-align:right;font-family:ui-monospace,monospace;font-size:12.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:0 13px;margin:8px 0}
details summary{cursor:pointer;padding:11px 0;font-weight:600;list:none;display:flex;justify-content:space-between;font-size:13px}
details summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px solid var(--line)}
details .body{padding:11px 0}
.divider{height:1px;background:var(--line);margin:12px 0}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--cyan) var(--p,50%),var(--line) var(--p,50));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid var(--cyan);box-shadow:var(--glow);cursor:pointer}
.knob{margin:13px 0}
.knob .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.knob .val{font-family:ui-monospace,monospace;color:var(--cyan);font-weight:700}
.knob .d{font-size:11px;color:var(--mut)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:rgba(10,14,22,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#dock .inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px}
#dock .pick{flex:1;min-width:0}
#dock .pick .a{font-size:11px;color:var(--mut)}
#dock .pick .b{font-size:14px;font-weight:800}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:78vh;overflow-y:auto;
  background:linear-gradient(180deg,#121c30,#0a101c);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:translateY(0)}
#sheet .handle{width:42px;height:4px;border-radius:4px;background:var(--mut);margin:2px auto 12px}
#backdrop{position:fixed;inset:0;z-index:55;background:rgba(4,7,13,.6);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s}
#backdrop.open{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--cyan);color:var(--txt);padding:9px 17px;border-radius:10px;z-index:80;
  opacity:0;transition:.25s;pointer-events:none;max-width:90%;font-size:13px}
.toast.show{opacity:1}
.flow-node{fill:#1a2740;stroke:var(--line);stroke-width:1.5}
.flow-lat{fill:#16243c;stroke:var(--cyan);stroke-width:1.5}
.flow-text{fill:var(--txt);font-size:11.5px;font-family:inherit}
.flow-path{stroke-width:1.8;fill:none;marker-end:url(#arrow)}
.fade{animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hidden{display:none}
.src{font-size:10.5px;word-break:break-all;color:var(--mut)}
.dash{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}
.disc{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ================= 首页：NBA球星卡风格 ================= */
body.land #hero,body.land #navwrap,body.land #dock{display:none}
body.land #content{padding-bottom:34px}
.arena{max-width:460px;margin:0 auto}
.stage{position:relative;height:56vh;min-height:430px;border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:
   radial-gradient(420px 300px at 50% -6%,rgba(90,162,255,.30) 0%,rgba(62,224,255,.10) 38%,transparent 68%),
   radial-gradient(600px 360px at 50% 118%,rgba(62,224,255,.16),transparent 60%),
   linear-gradient(180deg,#0d1730 0%,#0a1120 55%,#070b14 100%)}
.stage::after{content:"";position:absolute;inset:0;background:
   repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.025) 46px 47px);pointer-events:none}
.beam{position:absolute;top:-4%;left:50%;width:74%;height:80%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(180,225,255,.22),transparent 78%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(6px);pointer-events:none}
.platform{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:64%;height:30px;z-index:2;
  border-radius:50%;background:radial-gradient(ellipse at center,rgba(62,224,255,.55),rgba(62,224,255,.12) 55%,transparent 72%)}
.platform::after{content:"";position:absolute;left:50%;top:50%;width:120%;height:160%;transform:translate(-50%,-50%);
  border:1px solid rgba(62,224,255,.35);border-radius:50%}
.char{position:absolute;left:50%;bottom:30px;height:80%;z-index:3;transform:translateX(-50%);
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.55));animation:floaty 4.2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
.rate{position:absolute;top:14px;left:14px;z-index:5}
.sbadge{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-weight:900;font-size:30px;color:#3a2a05;
  background:linear-gradient(160deg,#ffe08a,#f6a821);box-shadow:0 8px 20px rgba(246,168,33,.4);border:1px solid rgba(255,255,255,.5)}
.pname{font-weight:900;font-size:19px;margin-top:9px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.stars{color:#ffc94a;font-size:13px;letter-spacing:2px;margin-top:2px}
.ovr{margin-top:8px;display:flex;align-items:baseline;gap:6px}
.ovr b{font-size:26px;font-weight:900;font-family:ui-monospace,monospace;color:var(--cyan)}
.ovr small{font-size:10.5px;color:var(--mut)}
.attrs{position:absolute;top:14px;right:12px;width:47%;z-index:5}
.arow{margin-bottom:10px}
.arow .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:4px}
.arow .top .al{color:var(--sub)}
.arow .top .av{font-family:ui-monospace,monospace;font-weight:700}
.arow .atrack{height:7px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.arow .afill{height:100%;border-radius:5px;box-shadow:0 0 10px currentColor}
.betpanel{margin-top:14px;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px}
.betpanel .lab-t{font-size:12px;color:var(--mut);margin-bottom:10px}
.circacts{display:flex;justify-content:space-around;margin-top:18px}
.circ{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;cursor:pointer}
.circ .ci{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(circle at 35% 28%,#1b2c49,#0e1728);box-shadow:0 8px 18px rgba(0,0,0,.4)}
.circ.primary .ci{border-color:transparent;background:radial-gradient(circle at 35% 28%,#16a6c4,#1557b8);box-shadow:var(--glow)}
.circ .cl{font-size:11.5px;color:var(--sub)}
.circ:active .ci{transform:scale(.94)}
@media(min-width:900px){.stage{min-height:480px}}
.pos{display:inline-block;margin-top:8px;font-size:10.5px;letter-spacing:1px;color:var(--cyan);
  background:rgba(62,224,255,.12);border:1px solid rgba(62,224,255,.3);padding:2px 8px;border-radius:6px}
.radar-card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.arch-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.arch-tag{font-weight:900;font-size:15px;color:#06121f;padding:4px 13px;border-radius:9px;
  background:linear-gradient(160deg,#7fe9ff,#3ee0ff);box-shadow:0 6px 16px rgba(62,224,255,.3)}
</style>
</head>
<body>
<div id="sticky">
  <div id="topbar">
    <div class="t">黄仁勋未来决策模拟器<small>社会计算沙箱 · 证据截止 2026-11-18</small></div>
    <button class="btn sm" id="openSheetTop">控制台</button>
  </div>
  <div id="hero"></div>
</div>
<div id="navwrap"><div id="navchips"></div></div>
<div id="content"></div>
<div id="dock"><div class="inner">
  <div class="pick"><div class="a">模型首选结局</div><div class="b" id="dockPick">–</div></div>
  <button class="btn primary sm" id="openSheet">调参数</button>
</div></div>
<div id="backdrop"></div>
<div id="sheet"><div class="handle"></div><h3 style="margin-bottom:8px">五旋钮控制台 <span class="tag">拖动即全图联动</span></h3><div id="sheetKnobs"></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm grow" id="resetKnob">重置</button><button class="btn primary sm grow" id="closeSheet">完成</button></div>
</div>
<div class="toast" id="toast"></div>

}

  const fg=new ForceGraph(DATA.edges,document.getElementById('fc'));let step=0;
  function loop(){fg.tick();fg.draw();snaRAF=requestAnimationFrame(loop);}loop();
  document.getElementById('iso').onclick=()=>{step++;fg.isolate(step);toast('已隔离 '+fg.removed.size+' 边');};
  document.getElementById('reset').onclick=()=>{step=0;fg.reset();};
  const g=buildGraph(DATA.edges),hub=g.idx['黄仁勋本人'];
  document.getElementById('bc').innerHTML=g.names.map((n,i)=>`<div class="barline"><span class="lab" style="width:64px;font-size:11px">${shortName(n)}</span>
    <div class="track"><div class="fill" style="width:${g.between[i]*100}%;background:${i===hub?'#3ee0ff':'#8b7bff'}"></div></div>
    <span class="num">${g.between[i].toFixed(3)}</span></div>`).join('');
  const links=DATA.edges.map(e=>({a:g.idx[e.source],b:g.idx[e.target],s:e.strength}));
  const hl=links.filter(l=>l.a===hub||l.b===hub).sort((u,v)=>v.s-u.s);
  const series=[];let adj=g.adj.map(r=>r.slice());
  for(let rm=0;rm<=hl.length;rm++){if(rm>0){const l=hl[rm-1];adj[l.a][l.b]-=l.s;adj[l.b][l.a]-=l.s;}
    series.push(adj[hub].reduce((a,b)=>a+b,0));}
  drawLine(document.getElementById('sl'),[{data:series,color:'#3ee0ff'}],{labels:series.map((_,i)=>i)});
};

R.counter=el=>{const x=S.knobs;
  const pols=[.2,.4,.6,.8,1],cs=[.2,.4,.6,.8,1];
  const grid=cs.map(cv=>pols.map(pv=>{const t=Object.assign({},x);t.Pol=pv;t.C=cv;return pointM1(t)[0];}));
  const tor=ORDER.map(k=>{const lo=Object.assign({},x),hi=Object.assign({},x);
    lo[k]=clamp(x[k]-HALF);hi[k]=clamp(x[k]+HALF);
    return{k,range:Math.abs(pointM1(hi)[0]-pointM1(lo)[0])};}).sort((a,b)=>b.range-a.range);
  const sob=ORDER.map(k=>[k,DATA.sobol[k].ST]).sort((a,b)=>b[1]-a[1]);
  el.innerHTML=`
  <div class="grid2">
    <div class="card" style="margin:0"><h3>Tornado</h3><div class="cv-wrap"><canvas id="to" height="180"></canvas></div></div>
    <div class="card" style="margin:0"><h3>Sobol 总效应</h3><div id="sob"></div></div></div>
  <div class="card" style="margin-top:14px"><h3>政治×向心力 → 回归</h3><div class="cv-wrap"><canvas id="heat" height="260"></canvas></div></div>
  <div class="card" style="margin-top:14px"><h3>阈值：单变量无法翻转首选</h3><div id="thr"></div></div>`;
  drawBars(document.getElementById('to'),tor.map(t=>t.k),tor.map(t=>t.range),tor.map(()=>'#5aa2ff'),true);
  document.getElementById('sob').innerHTML=sob.map(([k,v])=>`<div class="barline"><span class="lab" style="width:48px">${k}</span>
    <div class="track"><div class="fill" style="width:${v*100}%;background:#3ddc97"></div></div><span class="num">${v.toFixed(3)}</span></div>`).join('');
  drawHeat(document.getElementById('heat'),grid,pols.map(v=>v.toFixed(1)),cs.map(v=>v.toFixed(1)));
  document.getElementById('thr').innerHTML=ORDER.map(k=>`<div class="barline"><span class="lab" style="width:48px">${k}</span>
    <div class="track"><div class="fill" style="width:0%"></div></div><span class="num mut">无翻转</span></div>`).join('')
    +`<div class="mut" style="font-size:11.5px">首选须多变量联合才能翻转，单变量 0–1 扫描均不触发。</div>`;
};

    <div class="kpi"><div class="v cyan">${m.brier_score_mean}</div><div class="l">Brier(均匀.75)</div></div>

    <div class="sub" style="font-size:12px">${m.calibration_note}；编码者知结局存在事后偏差，本结果为机制检验，非样本外预测。</div></div></details>`;
};

R.profile=el=>{const p=pointM1(S.knobs);
  const agree=Object.values(S.viewReact).filter(v=>v==='yes').length,tags=[];
  if(S.bet==='comeback')tags.push('直觉回归派');else if(S.bet==='no')tags.push('直觉切割派');
  if(S.conf>=70)tags.push('高信心');else if(S.conf<=35)tags.push('谨慎');
  if(agree>=4)tags.push('易认同叙事');tags.push(S.theory==='power'?'博弈偏好':'系统偏好');
  el.innerHTML=`
  <div class="card"><h3>决策画像</h3>
    <div class="row wrap">${tags.map(t=>`<span class="chip on">${t}</span>`).join('')}</div>
    <div class="divider"></div>
    <div class="row between"><span class="sub">押注</span><b>${S.bet==='comeback'?'能回来':S.bet==='no'?'回不来':'未押'} · ${S.conf}%</b></div>
    <div class="row between" style="margin-top:8px"><span class="sub">模型回归概率</span><b class="grn mono">${pct(p[0])}</b></div>
    <div class="row between" style="margin-top:8px"><span class="sub">模型首选</span><b class="cyan">${SLABEL[STATES[p.indexOf(Math.max(...p))]]}</b></div></div>
  <div class="card"><h3>对账</h3><div class="sub" style="font-size:12.5px">差别不在结论，在权重；模型把假设摆上台，邀你校准，而非替代判断。</div></div>
  <div class="row"><button class="btn primary sm grow" id="back">回去调权重</button>
    <button class="btn ghost sm grow" id="restart">清空重玩</button></div>
  <div class="mut" style="font-size:10.5px;margin-top:12px">教学研究工具，不构成投资建议；缺证据不插值，已知偏差已披露。</div>`;
  document.getElementById('back').onclick=()=>location.hash='vars';
  document.getElementById('restart').onclick=()=>{localStorage.removeItem(KEY);S=fresh();save();renderHero();R.profile(el);};
};
